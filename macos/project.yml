name: BrowserRelay
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.2.0
    SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Shared/RelayCore.h
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_LDFLAGS: ['$(inherited)', '-liconv', '-lresolv']
targets:
  BrowserRelay:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ['*.plist']
      - path: Shared
      - path: build/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.originalsouth.browser-relay
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: BrowserRelay
    dependencies:
      - framework: build/RelayCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
  BrowserRelayTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.originalsouth.browser-relay.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BrowserRelay
schemes:
  BrowserRelay:
    build:
      targets:
        BrowserRelay: all
        BrowserRelayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [BrowserRelayTests]
    archive:
      config: Release

[package]
name = "browser-relay-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
browser-relay = { path = "..", default-features = false }

[[bin]]
name = "domain_lists"
path = "domain_lists.rs"
test = false
doc = false
bench = false

[[bin]]
name = "certificates"
path = "certificates.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

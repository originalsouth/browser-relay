version: 2

updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5

    # Include transitive dependencies recorded in Cargo.lock.
    allow:
      - dependency-type: all

    # Keep major version updates separate for review.
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
